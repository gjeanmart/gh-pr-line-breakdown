<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Line Breakdown</title>
  <link rel="stylesheet" href="../theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--fg);
      background: var(--bg);
      margin: 0;
      padding: 14px 16px 16px;
      width: 300px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-muted);
    }
    .header img { display: block; flex-shrink: 0; }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }

    #content { margin-bottom: 12px; min-height: 32px; }

    .message {
      color: var(--fg-muted);
      font-size: 12px;
      line-height: 1.5;
      margin: 4px 0;
    }

    .breakdown-header {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-muted);
    }
    .bh-lines  { color: var(--fg-muted); }
    .bh-files  { color: var(--fg-muted); }
    .bh-sep    { color: var(--border); }
    .bh-spacer { flex: 1; }
    .bh-added  { color: var(--success); font-weight: 500; }
    .bh-removed { color: var(--danger); font-weight: 500; }

    .rows { display: flex; flex-direction: column; gap: 5px; }
    .rows.hide-empty .row--empty { display: none; }

    .quota-line {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border-muted);
      font-size: 11px;
      color: var(--fg-muted);
    }
    .quota-line--out { color: var(--danger); }

    .cat-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 18px;
      padding: 0;
      background: none;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      color: var(--fg-subtle);
      opacity: .55;
    }
    .cat-toggle:hover { opacity: 1; background: var(--bg-subtle); }
    .cat-toggle--hidden { opacity: 1; color: var(--danger); }

    .rows-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      text-align: right;
    }
    .copy-md {
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
    }
    .copy-md:hover { text-decoration: underline; }

    .toggle-empty {
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
    }
    .toggle-empty:hover { text-decoration: underline; }

    .row {
      display: grid;
      grid-template-columns: 1fr 52px 52px 30px;
      align-items: center;
      gap: 5px;
    }

    .cat-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .cat-name {
      display: block;
      font-size: 12px;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cat-files {
      display: block;
      font-size: 10px;
      color: var(--fg-muted);
    }

    .stat {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .stat-added   { color: var(--success); }
    .stat-removed { color: var(--danger); }

    .pct {
      font-size: 11px;
      color: var(--fg-muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn {
      display: block;
      width: 100%;
      padding: 7px 0;
      background: var(--bg-subtle);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover { background: var(--accent-subtle); }

    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--fg-subtle);
    }
    .footer a {
      color: var(--fg-subtle);
      text-decoration: none;
    }
    .footer a:hover { color: var(--accent); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon32.png" width="20" height="20" alt="" />
    <span class="header-title">PR Line Breakdown</span>
  </div>
  <div id="content"></div>
  <button id="btn-options" class="btn">Open Options</button>
  <div class="footer">
    <span id="footer-version"></span>
    <a id="footer-repo" href="https://github.com/gjeanmart/gh-pr-line-breakdown" target="_blank">GitHub</a>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
